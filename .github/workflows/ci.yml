name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: kronolearn.settings.development
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kronolearn_test
      SECRET_KEY: ci-only-not-for-production
      DEBUG: 'True'
      ALLOWED_HOSTS: 'localhost,127.0.0.1'
      RAILWAY_ENV: ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kronolearn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.14 and cache pip
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Django check
        run: python manage.py check

      - name: Makemigrations check
        run: python manage.py makemigrations --check --dry-run

      - name: Django tests
        run: python manage.py test

      - name: DB unittest
        run: python -m unittest tests.db.test_db_connection -v
