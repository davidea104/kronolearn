{% extends "base.html" %}

{% block title %}Inicio | KronoLearn{% endblock %}

{% block content %}
<section class="hero" aria-labelledby="home-title">
  <p class="eyebrow">Sesión iniciada</p>
  <h1 id="home-title">Hola, {{ request.user.display_name }}</h1>
  <p class="lead">Tu espacio de aprendizaje está listo.</p>
  <div class="hero-actions">
    <a href="{% url 'catalog:track-list' %}" class="button">Explorar catálogo</a>
  </div>
</section>

<style>
  .hero {
    padding: 4rem 0;
    text-align: center;
  }
  .hero .eyebrow {
    display: inline-block;
    margin-bottom: 1rem;
  }
  .hero h1 {
    font-size: 40px;
    margin: 1rem 0;
  }
  .lead {
    font-size: 18px;
    color: var(--ink-secondary);
    margin: 1rem 0;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
  }
  .hero-actions {
    margin-top: 2rem;
  }
</style>
{% endblock %}
